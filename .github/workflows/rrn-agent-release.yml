name: Build RRN Agent Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent/RRN.Agent/**'
      - 'agent/RRN.Agent.Tray/**'
      - 'agent/RRN.Agent.Setup/**'
      - 'agent/install.ps1'
      - 'agent/uninstall.ps1'
      - 'img/icon-png.png'
      - '.github/workflows/rrn-agent-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows icon from RRN logo
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image
          from pathlib import Path

          src = Path('img/icon-png.png')
          image = Image.open(src).convert('RGBA')
          sizes = [(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)]
          targets = [
              Path('agent/RRN.Agent/rrn.ico'),
              Path('agent/RRN.Agent.Tray/rrn.ico'),
              Path('build/rrn.ico')
          ]
          for target in targets:
              target.parent.mkdir(parents=True, exist_ok=True)
              image.save(target, format='ICO', sizes=sizes)
          '@ | python -

      - name: Publish Windows x64 agent, tray and setup
        shell: pwsh
        run: |
          dotnet restore agent/RRN.Agent/RRN.Agent.csproj
          dotnet restore agent/RRN.Agent.Tray/RRN.Agent.Tray.csproj
          dotnet restore agent/RRN.Agent.Setup/RRN.Agent.Setup.csproj
          dotnet publish agent/RRN.Agent/RRN.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o dist/core
          dotnet publish agent/RRN.Agent.Tray/RRN.Agent.Tray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o dist/tray
          dotnet publish agent/RRN.Agent.Setup/RRN.Agent.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o dist/setup
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/core/RRN.Agent.exe package/RRN.Agent.exe
          Copy-Item dist/tray/RRN.Agent.Tray.exe package/RRN.Agent.Tray.exe
          Copy-Item dist/setup/RRN.Agent.Setup.exe package/RRN.Agent.Setup.exe
          Copy-Item img/icon-png.png package/rrn-logo.png
          Copy-Item agent/install.ps1 package/install.ps1
          Copy-Item agent/uninstall.ps1 package/uninstall.ps1

          foreach ($name in @('RRN.Agent.exe','RRN.Agent.Tray.exe','RRN.Agent.Setup.exe')) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path 'package' $name)).Hash.ToLowerInvariant()
            Set-Content -NoNewline -Path (Join-Path 'package' ($name + '.sha256')) -Value $hash
          }

          Compress-Archive -Path package/RRN.Agent.exe,package/RRN.Agent.exe.sha256,package/RRN.Agent.Tray.exe,package/RRN.Agent.Tray.exe.sha256,package/RRN.Agent.Setup.exe,package/RRN.Agent.Setup.exe.sha256,package/rrn-logo.png,package/install.ps1,package/uninstall.ps1 -DestinationPath package/RRN-Agent-Windows-x64.zip -Force
          $zipHash = (Get-FileHash -Algorithm SHA256 package/RRN-Agent-Windows-x64.zip).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path package/RRN-Agent-Windows-x64.zip.sha256 -Value $zipHash

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RRN-Agent-Windows-x64
          path: |
            package/RRN.Agent.exe
            package/RRN.Agent.exe.sha256
            package/RRN.Agent.Tray.exe
            package/RRN.Agent.Tray.exe.sha256
            package/RRN.Agent.Setup.exe
            package/RRN.Agent.Setup.exe.sha256
            package/rrn-logo.png
            package/install.ps1
            package/uninstall.ps1
            package/RRN-Agent-Windows-x64.zip
            package/RRN-Agent-Windows-x64.zip.sha256

      - name: Replace rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rrn-agent-latest --yes --cleanup-tag || true
          gh release create rrn-agent-latest \
            package/RRN.Agent.exe \
            package/RRN.Agent.exe.sha256 \
            package/RRN.Agent.Tray.exe \
            package/RRN.Agent.Tray.exe.sha256 \
            package/RRN.Agent.Setup.exe \
            package/RRN.Agent.Setup.exe.sha256 \
            package/rrn-logo.png \
            package/install.ps1 \
            package/uninstall.ps1 \
            package/RRN-Agent-Windows-x64.zip \
            package/RRN-Agent-Windows-x64.zip.sha256 \
            --title "RRN Agent Windows (latest)" \
            --notes "RRN Agent Windows x64 v0.3.1 com hardening de rede: bloqueio explícito de conexões de entrada no Windows Firewall, auditoria fail-closed contra portas TCP em LISTENING, validação do endpoint autorizado, proteção de ACL dos dados locais e hashes SHA-256 publicados para os executáveis."
